# =====================================================================================
# VEKTORA — docker compose (Nivel 1)
# =====================================================================================
#   cp .env.example .env      # y completar los valores
#   docker compose up --build -d
#   docker compose ps         # db y app "healthy"
#   abrir http://localhost:3000
#
# Dos servicios:
#   · db  — PostgreSQL 16 con pgvector. Al crearse el volumen VACÍO ejecuta, en orden,
#           sql/01-crear-tablas.sql y sql/02-datos-prueba.sql (initdb).
#   · app — la imagen del Dockerfile. Espera a que la base esté sana antes de arrancar.
# Y uno opcional, con perfil `ia`: `inferencia` (llama.cpp con un modelo local). Ver abajo.
#
# Credenciales: todas salen de `.env` (que está en .gitignore). Este archivo no tiene
# ninguna. Los DB_* de la app se FIJAN acá al contenedor `db`, así el mismo `.env` puede
# tener los datos de Aiven para `npm run dev` sin que el compose se conecte a la nube.
# =====================================================================================

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Definí POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Definí POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
    volumes:
      - datos:/var/lib/postgresql/data
      # Solo lectura: el contenedor no puede modificar los scripts del repo.
      - ./sql:/docker-entrypoint-initdb.d:ro
    # Solo en 127.0.0.1: la base no queda expuesta a la red local, pero se puede consultar
    # desde la PC (psql, DBeaver) para la evidencia del SELECT.
    ports:
      - "127.0.0.1:${DB_PUERTO_LOCAL:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build: .
    image: ghcr.io/nicrolax/vektora:local
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Red interna de Docker: la base no tiene certificado. A Aiven se conecta con SSL.
      DB_SSL: disable
      DB_SSL_CA: ""
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Inferencia propia (pivot, S1 · B): llama.cpp sirviendo un modelo GGUF local. Ninguna
  # API externa: el modelo es un archivo de `modelos/` (npm run modelo:bajar) y, una vez
  # bajado, funciona sin internet.
  #
  #   npm run modelo:bajar
  #   docker compose up -d --wait inferencia
  #   curl http://127.0.0.1:8080/health        # 200 cuando el modelo terminó de cargar
  #   docker compose --profile ia down         # sin --profile ia, `down` NO lo baja
  #
  # Perfil `ia`: `docker compose up` a secas NO lo levanta, para que quien no bajó el
  # modelo siga teniendo db + app sanas. Nombrarlo (`up inferencia`) lo levanta igual.
  # La app todavía no lo usa (eso es S2 · A) y por eso NO hay depends_on: cuando lo use,
  # tiene que degradar si la inferencia no responde, no esperarla para siempre.
  inferencia:
    profiles: ["ia"]
    # Build b11870 (2026-10-25), fijada por digest: el tag solo no garantiza los mismos bytes.
    image: ghcr.io/ggml-org/llama.cpp:server-b11870@sha256:1fa7f8f0ca663fdcf3203dc125a7e0b5c9e49c9ed054b049599666cd7e300eb0
    restart: unless-stopped
    # Endurecido: usuario sin privilegios, sistema de archivos de solo lectura, sin
    # capacidades. El modelo se monta en solo lectura.
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    volumes:
      - ./modelos:/modelos:ro
    environment:
      LLAMA_ARG_MODEL: /modelos/${INFERENCIA_MODELO:-Qwen3-1.7B-Q4_K_M.gguf}
      LLAMA_ARG_ALIAS: vektora-local
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_CTX_SIZE: ${INFERENCIA_CONTEXTO:-8192}
      LLAMA_ARG_N_PARALLEL: "1"
      LLAMA_ARG_JINJA: "1"
    # Sin el modelo, llama-server muere con un error en inglés poco claro. Esto dice qué hacer.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f "$$LLAMA_ARG_MODEL" ]; then
          echo "No encuentro el modelo $$LLAMA_ARG_MODEL. Bajalo con 'npm run modelo:bajar' (queda en modelos/) o elegí otro archivo con INFERENCIA_MODELO en .env." >&2
          exit 1
        fi
        exec /app/llama-server
    # Solo en 127.0.0.1: la app lo alcanza por la red interna (http://inferencia:8080).
    ports:
      - "127.0.0.1:${INFERENCIA_PUERTO_LOCAL:-8080}:8080"
    healthcheck:
      # /health responde 503 mientras carga el modelo y 200 cuando está listo.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  datos:
