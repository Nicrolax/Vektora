# VEKTORA — Service de la aplicación (Nivel 3).
# NodePort: expone la app en un puerto fijo del nodo (30080). En minikube:
#   minikube service vektora-app --url      → http://<ip-de-minikube>:30080
apiVersion: v1
kind: Service
metadata:
  name: vektora-app
  labels:
    app.kubernetes.io/name: vektora-app
    app.kubernetes.io/part-of: vektora
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: vektora-app
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30080
