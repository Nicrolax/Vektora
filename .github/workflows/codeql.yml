# VEKTORA — SAST automatizado con CodeQL (Fase 5). Complementa a SonarLint (que el equipo
# corre en VS Code): analiza el TypeScript de app/, lib/, components/ y scripts/ buscando
# inyección, XSS, redirecciones abiertas, secretos en el código, etc. Gratis en repos
# públicos; los resultados quedan en la pestaña Security → Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 11 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
